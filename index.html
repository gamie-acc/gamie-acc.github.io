<style>
:root{
  --bg:#0e0a09;
  --panel:#171110;
  --gold:#c9a24a;
  --gold-soft:#e6cf8e;
  --gold-deep:#8d6a24;
  --ivory:#f7f1e4;
  --text:#f3ead8;
  --muted:#a89877;
  --ok:#6fcf97;
  --serif:"Amiri","Traditional Arabic","Times New Roman",serif;
  --sans:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  /* مقاسات تتكيّف مع عرض الشاشة */
  --pad-page:clamp(10px,4vw,28px);
  --pad-card:clamp(14px,5vw,24px);
  --pad-field:clamp(12px,3.6vw,16px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--text);min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(180,28,32,.38), transparent 60%),
    radial-gradient(700px 500px at 50% 110%, rgba(201,162,74,.10), transparent 60%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:var(--pad-page);overflow-x:hidden;
}

/* إطار ذهبي مزدوج */
.frame{
  width:100%;max-width:440px;padding:clamp(5px,1.6vw,7px);border-radius:30px;
  background:linear-gradient(145deg,var(--gold-soft),var(--gold) 35%,var(--gold-deep) 70%,var(--gold-soft));
  box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);
}
.card{
  border-radius:24px;overflow:hidden;position:relative;
  background:
    linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%),
    var(--panel);
  border:1px solid rgba(0,0,0,.6);
  padding:clamp(24px,7vw,34px) var(--pad-card) clamp(18px,5vw,26px);
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(45deg,rgba(201,162,74,.035) 0 1px,transparent 1px 14px);
}
.card>*{position:relative;min-width:0}

/* الرأس */
.head{text-align:center}
.logo-ring{
  width:clamp(88px,28vw,118px);height:clamp(88px,28vw,118px);margin:0 auto;border-radius:50%;padding:4px;
  background:conic-gradient(from 200deg,var(--gold-soft),var(--gold),var(--gold-deep),var(--gold-soft),var(--gold));
  box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 40px rgba(201,162,74,.18);
}
.logo-ring img{
  width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
  border:3px solid #fff;background:#fff;
}
.eyebrow{
  margin-top:clamp(14px,4.5vw,22px);font-size:clamp(11px,3.2vw,12.5px);letter-spacing:2px;color:var(--gold);font-weight:500;
}
h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(21px,6.8vw,28px);line-height:1.55;margin-top:6px;
  background:linear-gradient(180deg,#fff4d3,var(--gold-soft) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.divider{
  display:flex;align-items:center;gap:12px;margin:clamp(12px,4vw,20px) auto 0;max-width:240px;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);display:block}

/* بطاقة البنك */
.bank{
  margin-top:clamp(16px,5vw,26px);border-radius:16px;padding:clamp(10px,3vw,12px) var(--pad-field);
  background:linear-gradient(160deg,#fffdf7,var(--ivory));
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(201,162,74,.55);
  color:#2a2118;
}
.bank .k{font-size:12px;color:#8a7650;letter-spacing:1px}
.bank .v{font-family:var(--serif);font-size:clamp(18px,5.6vw,21px);font-weight:700;margin-top:1px}
.bank img{height:clamp(40px,12.5vw,54px);width:auto;max-width:55%;display:block;mix-blend-mode:multiply}

/* الحقول: العنوان + زرار النسخ فوق، والقيمة تحتهم بعرض كامل */
.field{
  margin-top:clamp(10px,3.4vw,14px);border-radius:16px;padding:var(--pad-field);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid rgba(201,162,74,.32);
}
.field .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.field .k{font-size:clamp(11.5px,3.3vw,13px);color:var(--gold);letter-spacing:1.2px;font-weight:500}
.field .v{
  font-family:var(--serif);font-weight:700;color:var(--text);
  font-size:clamp(17px,5.6vw,22px);line-height:1.5;
  white-space:nowrap;                 /* سطر واحد، والـ JS بيصغّر الخط لو لزم */
  display:block;width:100%;
}
.field .v.wrap{white-space:normal}
.field .v.num{
  font-family:"Tajawal",Consolas,monospace;font-size:clamp(17px,5.8vw,23px);
  letter-spacing:.06em;direction:ltr;text-align:right;color:var(--gold-soft);
}
.copy{
  flex:none;cursor:pointer;font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.3px;
  color:#1b130a;border:0;border-radius:10px;padding:8px 18px;min-width:72px;
  background:linear-gradient(145deg,var(--gold-soft),var(--gold) 55%,var(--gold-deep));
  box-shadow:0 4px 14px rgba(201,162,74,.28),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .1s ease,filter .2s ease;
}
.copy:hover{filter:brightness(1.07)}
.copy:active{transform:scale(.94)}
.copy.done{background:linear-gradient(145deg,#bff0d3,var(--ok));color:#0d2a1a}

.note{
  text-align:center;color:var(--muted);font-size:clamp(11.5px,3.3vw,12.5px);margin-top:clamp(14px,4.5vw,22px);letter-spacing:.3px;
}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;
  background:rgba(23,17,16,.96);color:var(--gold-soft);border:1px solid var(--gold);
  padding:11px 24px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;
  transition:all .25s ease;pointer-events:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* شاشات الموبايل الصغيرة جدًا */
@media (max-width:340px){
  .copy{padding:7px 12px;min-width:60px;font-size:13px}
  .frame{border-radius:24px}
  .card{border-radius:19px}
}
/* شاشات قصيرة (موبايل أفقي) */
@media (max-height:520px){
  body{align-items:flex-start}
}
</style>
</head>
<body>
<div class="frame">
  <main class="card">
    <header class="head">
      <div class="logo-ring"><img src="logo.jpg" alt="شعار شركة محمد جامع"></div>
      <div class="eyebrow">بيانات الحساب البنكي</div>
      <h1>شركة محمد جامع<br>للتجارة والتوكيلات</h1>
      <div class="divider"><i></i></div>
    </header>

    <div class="bank">
      <div>
        <div class="k">البنك</div>
        <div class="v">بنك مصر</div>
      </div>
      <img src="bank-logo.png" alt="شعار بنك مصر">
    </div>

    <div class="field">
      <div class="top">
        <div class="k">اسم المستفيد</div>
        <button class="copy" data-target="v-name">نسخ</button>
      </div>
      <div class="v fit" id="v-name" data-copy="شركة محمد جامع للتجارة والتوكيلات">شركة محمد جامع للتجارة والتوكيلات</div>
    </div>

    <div class="field">
      <div class="top">
        <div class="k">رقم الحساب</div>
        <button class="copy" data-target="v-acc">نسخ</button>
      </div>
      <div class="v num fit" id="v-acc" data-copy="8450001000000602">8450 0010 0000 0602</div>
    </div>

    <p class="note">اضغط «نسخ» ثم الصق البيانات في تطبيق البنك</p>
  </main>
</div>
<div class="toast" id="toast">تم النسخ ✓</div>

<script>
(function(){
  /* ===== ضبط حجم الخط تلقائيًا ليدخل في سطر واحد مهما كان عرض الشاشة ===== */
  var MIN_FONT = 13;
  function fit(el){
    el.classList.remove('wrap');
    el.style.fontSize = '';
    var size = parseFloat(getComputedStyle(el).fontSize);
    var guard = 60;
    while (el.scrollWidth > el.clientWidth + 0.5 && size > MIN_FONT && guard--) {
      size -= 0.5;
      el.style.fontSize = size + 'px';
    }
    if (el.scrollWidth > el.clientWidth + 0.5) el.classList.add('wrap'); /* آخر حل: يلف على سطرين */
  }
  function fitAll(){ document.querySelectorAll('.fit').forEach(fit); }
  var raf;
  function schedule(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(fitAll); }
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', schedule);
  window.addEventListener('load', fitAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  fitAll();

  /* ===== النسخ ===== */
  var toast = document.getElementById('toast'), t;
  function show(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(t); t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }
  function legacy(text){
    return new Promise(function(res, rej){
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
      try { document.execCommand('copy') ? res() : rej(); } catch(e){ rej(e); }
      document.body.removeChild(ta);
    });
  }
  function copyText(text){
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function(){ return legacy(text); });
    }
    return legacy(text);
  }
  document.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(){
      var text = document.getElementById(btn.dataset.target).dataset.copy;
      copyText(text).then(function(){
        btn.classList.add('done'); btn.textContent = 'تم ✓';
        setTimeout(function(){ btn.classList.remove('done'); btn.textContent = 'نسخ'; }, 1600);
        show('تم النسخ ✓');
      }, function(){ show('تعذّر النسخ، انسخ يدويًا'); });
    });
  });
})();
</script>
</body>
