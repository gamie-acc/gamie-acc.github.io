<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رقم حساب الشركة</title>
<meta name="description" content="شركة محمد جامع للتجارة والتوكيلات — بيانات الحساب البنكي (بنك مصر)">

<!-- معاينة الرابط على واتساب -->
<meta property="og:type" content="website">
<meta property="og:title" content="رقم حساب الشركة">
<meta property="og:description" content="شركة محمد جامع للتجارة والتوكيلات — بنك مصر">
<meta property="og:image" content="https://gamie-acc.github.io/og.jpg">
<meta property="og:url" content="https://gamie-acc.github.io/">
<meta property="og:locale" content="ar_EG">
<meta name="theme-color" content="#120d0c">
<link rel="icon" href="logo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0e0a09;
  --panel:#171110;
  --gold:#c9a24a;
  --gold-soft:#e6cf8e;
  --gold-deep:#8d6a24;
  --ivory:#f7f1e4;
  --text:#f3ead8;
  --muted:#a89877;
  --ok:#6fcf97;
  --serif:"Amiri","Traditional Arabic","Times New Roman",serif;
  --sans:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:var(--sans);color:var(--text);min-height:100vh;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(180,28,32,.38), transparent 60%),
    radial-gradient(700px 500px at 50% 110%, rgba(201,162,74,.10), transparent 60%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;padding:28px 16px;
}

/* إطار ذهبي مزدوج */
.frame{
  width:100%;max-width:440px;padding:7px;border-radius:30px;
  background:linear-gradient(145deg,var(--gold-soft),var(--gold) 35%,var(--gold-deep) 70%,var(--gold-soft));
  box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);
}
.card{
  border-radius:24px;overflow:hidden;position:relative;
  background:
    linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%),
    var(--panel);
  border:1px solid rgba(0,0,0,.6);
  padding:34px 22px 26px;
}
.card::before{ /* نقش دقيق */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(45deg,rgba(201,162,74,.035) 0 1px,transparent 1px 14px);
}
.card>*{position:relative}

/* الرأس */
.head{text-align:center}
.logo-ring{
  width:118px;height:118px;margin:0 auto;border-radius:50%;padding:4px;
  background:conic-gradient(from 200deg,var(--gold-soft),var(--gold),var(--gold-deep),var(--gold-soft),var(--gold));
  box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 40px rgba(201,162,74,.18);
}
.logo-ring img{
  width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
  border:3px solid #fff;background:#fff;
}
.eyebrow{
  margin-top:22px;font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:500;
}
h1{
  font-family:var(--serif);font-weight:700;font-size:27px;line-height:1.55;margin-top:8px;
  background:linear-gradient(180deg,#fff4d3,var(--gold-soft) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.divider{
  display:flex;align-items:center;gap:12px;margin:20px auto 0;max-width:260px;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);display:block}

/* بطاقة البنك */
.bank{
  margin-top:26px;border-radius:16px;padding:12px 16px;
  background:linear-gradient(160deg,#fffdf7,var(--ivory));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(201,162,74,.55);
  color:#2a2118;
}
.bank .k{font-size:12px;color:#8a7650;letter-spacing:1px}
.bank .v{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:1px}
.bank img{height:54px;width:auto;display:block;mix-blend-mode:multiply}

/* الحقول */
.field{
  margin-top:14px;border-radius:16px;padding:16px 16px 16px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid rgba(201,162,74,.32);
}
.field .txt{min-width:0}
.field .k{font-size:12px;color:var(--gold);letter-spacing:1.5px;margin-bottom:6px;font-weight:500}
.field .v{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.5;color:var(--text);word-break:break-word}
.field .v.num{
  font-family:"Tajawal",Consolas,monospace;font-weight:700;font-size:21px;letter-spacing:1.5px;
  direction:ltr;text-align:right;color:var(--gold-soft);white-space:nowrap;
}
.copy{
  flex:none;cursor:pointer;font:inherit;font-size:14px;font-weight:700;letter-spacing:.5px;
  color:#1b130a;border:0;border-radius:12px;padding:12px 18px;min-width:80px;
  background:linear-gradient(145deg,var(--gold-soft),var(--gold) 55%,var(--gold-deep));
  box-shadow:0 4px 14px rgba(201,162,74,.28),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .1s ease,filter .2s ease;
}
.copy:hover{filter:brightness(1.07)}
.copy:active{transform:scale(.94)}
.copy.done{background:linear-gradient(145deg,#bff0d3,var(--ok));color:#0d2a1a}

.note{
  text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px;letter-spacing:.3px;
}

.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,30px);opacity:0;
  background:rgba(23,17,16,.96);color:var(--gold-soft);border:1px solid var(--gold);
  padding:12px 26px;border-radius:999px;font-size:14px;font-weight:500;
  transition:all .25s ease;pointer-events:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:380px){
  h1{font-size:23px}
  .field .v.num{font-size:17px;letter-spacing:1px}
  .copy{padding:11px 14px;min-width:68px}
  .field .v{font-size:18px}
}
</style>
</head>
<body>
<div class="frame">
  <main class="card">
    <header class="head">
      <div class="logo-ring"><img src="logo.jpg" alt="شعار شركة محمد جامع"></div>
      <div class="eyebrow">بيانات الحساب البنكي</div>
      <h1>شركة محمد جامع<br>للتجارة والتوكيلات</h1>
      <div class="divider"><i></i></div>
    </header>

    <div class="bank">
      <div>
        <div class="k">البنك</div>
        <div class="v">بنك مصر</div>
      </div>
      <img src="bank-logo.png" alt="شعار بنك مصر">
    </div>

    <div class="field">
      <div class="txt">
        <div class="k">اسم المستفيد</div>
        <div class="v" id="v-name" data-copy="شركة محمد جامع للتجارة والتوكيلات">شركة محمد جامع للتجارة والتوكيلات</div>
      </div>
      <button class="copy" data-target="v-name">نسخ</button>
    </div>

    <div class="field">
      <div class="txt">
        <div class="k">رقم الحساب</div>
        <div class="v num" id="v-acc" data-copy="8450001000000602">8450 0010 0000 0602</div>
      </div>
      <button class="copy" data-target="v-acc">نسخ</button>
    </div>

    <p class="note">اضغط «نسخ» ثم الصق البيانات في تطبيق البنك</p>
  </main>
</div>
<div class="toast" id="toast">تم النسخ ✓</div>

<script>
(function(){
  var toast = document.getElementById('toast'), t;
  function show(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(t); t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }
  function legacy(text){
    return new Promise(function(res, rej){
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
      try { document.execCommand('copy') ? res() : rej(); } catch(e){ rej(e); }
      document.body.removeChild(ta);
    });
  }
  function copyText(text){
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function(){ return legacy(text); });
    }
    return legacy(text);
  }
  document.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(){
      var text = document.getElementById(btn.dataset.target).dataset.copy;
      copyText(text).then(function(){
        btn.classList.add('done'); btn.textContent = 'تم ✓';
        setTimeout(function(){ btn.classList.remove('done'); btn.textContent = 'نسخ'; }, 1600);
        show('تم النسخ ✓');
      }, function(){ show('تعذّر النسخ، انسخ يدويًا'); });
    });
  });
})();
</script>
</body>
</html>
