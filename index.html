<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رقم حساب الشركة</title>
<meta name="description" content="شركة محمد جامع للتجارة والتوكيلات — بيانات الحساب البنكي (بنك مصر)">

<!-- معاينة الرابط على واتساب -->
<meta property="og:type" content="website">
<meta property="og:title" content="رقم حساب الشركة">
<meta property="og:description" content="شركة محمد جامع للتجارة والتوكيلات — بنك مصر. اضغط لنسخ بيانات الحساب">
<meta property="og:image" content="https://amerms1982-boop.github.io/company-account/company-logo.jpg">
<meta property="og:url" content="https://amerms1982-boop.github.io/company-account/">
<meta property="og:locale" content="ar_EG">
<meta name="theme-color" content="#c8191f">
<link rel="icon" href="company-logo.jpg">

<style>
:root{
  --red:#c8191f; --red-dark:#8f1015; --ink:#1d1d1f; --muted:#6b6b72;
  --bg:#f4f1ee; --card:#ffffff; --line:#ece7e2; --gold:#c9a24a; --ok:#1f8f4e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; align-items:flex-start; justify-content:center; padding:20px 16px 40px;
}
.card{
  width:100%; max-width:440px; background:var(--card); border-radius:24px; overflow:hidden;
  box-shadow:0 10px 40px rgba(60,20,20,.14);
}
.head{
  background:linear-gradient(160deg,var(--red) 0%,var(--red-dark) 100%);
  color:#fff; text-align:center; padding:28px 20px 56px; position:relative;
}
.head h1{font-size:19px;font-weight:700;line-height:1.6;margin-top:12px}
.head p{font-size:13px;opacity:.85;margin-top:4px}
.logo{
  width:96px;height:96px;border-radius:50%;background:#fff;object-fit:cover;
  border:4px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.body{padding:0 18px 22px;margin-top:-34px;position:relative}
.bank{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.06);
}
.bank .label{font-size:12px;color:var(--muted)}
.bank .name{font-size:16px;font-weight:700;margin-top:2px}
.bank img{height:52px;width:auto;display:block}

.field{
  margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fffdfb;
}
.field .txt{min-width:0}
.field .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.field .value{font-size:17px;font-weight:700;line-height:1.5;word-break:break-word}
.field .value.num{
  font-family:Consolas,"SF Mono",Menlo,monospace;font-size:20px;letter-spacing:1.5px;
  direction:ltr;text-align:right;
}
.copy{
  flex:none;border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:700;
  background:var(--red);color:#fff;border-radius:12px;padding:11px 16px;min-width:76px;
  transition:transform .08s ease,background .2s ease;
}
.copy:active{transform:scale(.95)}
.copy.done{background:var(--ok)}
.all{
  margin-top:18px;width:100%;border:2px solid var(--red);background:#fff;color:var(--red);
  font:inherit;font-size:15px;font-weight:700;border-radius:14px;padding:13px;cursor:pointer;
}
.all.done{background:var(--ok);border-color:var(--ok);color:#fff}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
.gold{height:4px;background:linear-gradient(90deg,var(--gold),#f0d98a,var(--gold))}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;
  background:#1d1d1f;color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;
  transition:all .25s ease;pointer-events:none;z-index:9;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="card">
  <div class="gold"></div>
  <header class="head">
    <img class="logo" src="company-logo.jpg" alt="شعار شركة محمد جامع">
    <h1>شركة محمد جامع<br>للتجارة والتوكيلات</h1>
    <p>بيانات الحساب البنكي</p>
  </header>

  <section class="body">
    <div class="bank">
      <div>
        <div class="label">البنك</div>
        <div class="name">بنك مصر</div>
      </div>
      <img src="bank-logo.png" alt="شعار بنك مصر">
    </div>

    <div class="field">
      <div class="txt">
        <div class="label">اسم المستفيد</div>
        <div class="value" id="v-name">شركة محمد جامع للتجارة والتوكيلات</div>
      </div>
      <button class="copy" data-target="v-name">نسخ</button>
    </div>

    <div class="field">
      <div class="txt">
        <div class="label">رقم الحساب</div>
        <div class="value num" id="v-acc">8450001000000602</div>
      </div>
      <button class="copy" data-target="v-acc">نسخ</button>
    </div>

    <button class="all" id="copy-all">نسخ كل البيانات</button>
    <p class="note">اضغط "نسخ" ثم الصق البيانات في تطبيق البنك</p>
  </section>
</main>
<div class="toast" id="toast">تم النسخ ✓</div>

<script>
(function(){
  var toast = document.getElementById('toast'), t;
  function show(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(t); t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }
  function copyText(text){
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function(){ return legacy(text); });
    }
    return legacy(text);
  }
  function legacy(text){
    return new Promise(function(res, rej){
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
      try { document.execCommand('copy') ? res() : rej(); } catch(e){ rej(e); }
      document.body.removeChild(ta);
    });
  }
  function flash(btn, idle){
    btn.classList.add('done'); btn.textContent = 'تم ✓';
    setTimeout(function(){ btn.classList.remove('done'); btn.textContent = idle; }, 1600);
  }
  document.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(){
      var text = document.getElementById(btn.dataset.target).textContent.trim();
      copyText(text).then(function(){ flash(btn,'نسخ'); show('تم النسخ ✓'); },
                          function(){ show('تعذّر النسخ، انسخ يدويًا'); });
    });
  });
  document.getElementById('copy-all').addEventListener('click', function(e){
    var name = document.getElementById('v-name').textContent.trim();
    var acc  = document.getElementById('v-acc').textContent.trim();
    var text = 'اسم المستفيد: ' + name + '\nرقم الحساب: ' + acc + '\nالبنك: بنك مصر';
    copyText(text).then(function(){ flash(e.currentTarget,'نسخ كل البيانات'); show('تم نسخ كل البيانات ✓'); },
                        function(){ show('تعذّر النسخ، انسخ يدويًا'); });
  });
})();
</script>
</body>
</html>
